<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Projetos e ações | Mandato em Ação</title>
<meta name="theme-color" content="#071a32">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<header class="topbar">
<a href="./index.html">‹ Voltar ao início</a>
<h1>Projetos e ações</h1>
<p>Um espaço para acompanhar iniciativas, pedidos, emendas e resultados do mandato.</p>
</header>
<main class="page-content">
<div class="chips">
  <span class="chip active" data-pf="todos">Todos</span>
  <span class="chip" data-pf="projeto">Projetos de lei</span>
  <span class="chip" data-pf="pedido">Pedidos</span>
  <span class="chip" data-pf="emenda">Emendas</span>
  <span class="chip" data-pf="resultado">Resultados</span>
</div>

<div id="projetosLista">
  <section class="feed-card"><p>Carregando projetos e ações...</p></section>
</div>
</main>
<nav class="bottom-nav">
<a class="nav-item " href="./index.html"><b>⌂</b>Início</a>
<a class="nav-item" href="./solicitacao.html"><b>＋</b>Solicitar</a>
<a class="nav-item" href="./acompanhar.html"><b>⌕</b>Acompanhar</a>
<a class="nav-item" href="../index.html"><b>•••</b>Mais</a>
</nav>
</div>
<script>
const SUPABASE_URL="https://pmmsdjozyyxkbuqlkfpb.supabase.co";
const SUPABASE_KEY="sb_publishable_DA687gC36Y6UO3up6G8ZDA_OeLoqZk_";
let projetosPublicos=[];

function esc(v){
  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function nomeTipo(t){
  return ({projeto:"Projeto / Lei",pedido:"Pedido de Providência",emenda:"Emenda",resultado:"Resultado"})[t]||t;
}
function renderProjetos(filtro="todos"){
  const alvo=document.getElementById("projetosLista");
  const itens=projetosPublicos.filter(x=>filtro==="todos"||x.tipo===filtro);
  if(!itens.length){
    alvo.innerHTML='<section class="feed-card"><h2>Nenhum conteúdo nesta categoria</h2><p>Novos projetos e ações serão publicados aqui.</p></section>';
    return;
  }
  alvo.innerHTML=itens.map(item=>`
    <section class="feed-card project-item" data-type="${esc(item.tipo)}">
      <div class="eyebrow">${esc(nomeTipo(item.tipo))}${item.destaque?' · Destaque':''}</div>
      <h2>${esc(item.titulo)}</h2>
      ${item.foto_url?'<img class="project-photo" src="'+esc(item.foto_url)+'" alt="Foto de '+esc(item.titulo)+'">':""}
      <p>${esc(item.resumo||"")}</p>
      <div class="meta">
        ${item.referencia?'<span>📄 '+esc(item.referencia)+'</span>':""}
        ${item.area?'<span>🏛️ '+esc(item.area)+'</span>':""}
        ${item.situacao?'<span>🔵 '+esc(item.situacao)+'</span>':""}
      </div>
    </section>`).join("");
}
async function carregarProjetos(){
  const alvo=document.getElementById("projetosLista");
  try{
    const resp=await fetch(SUPABASE_URL+"/rest/v1/projetos_acoes_publicos?select=*&publicado=eq.true&order=ordem.asc,criado_em.desc",{
      headers:{"apikey":SUPABASE_KEY}
    });
    const dados=await resp.json();
    if(!resp.ok) throw new Error("Falha ao carregar");
    projetosPublicos=Array.isArray(dados)?dados:[];
    renderProjetos("todos");
  }catch(e){
    alvo.innerHTML='<section class="feed-card"><h2>Não foi possível carregar agora</h2><p>Tente novamente em alguns instantes.</p></section>';
  }
}
document.querySelectorAll('.chip[data-pf]').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.chip[data-pf]').forEach(x=>x.classList.remove('active'));
    chip.classList.add('active');
    renderProjetos(chip.dataset.pf);
  });
});
carregarProjetos();
</script>
</body>
</html>
