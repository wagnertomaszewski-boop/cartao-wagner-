<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nova solicitação | Mandato em Ação</title>
  <meta name="theme-color" content="#071a32">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a href="./index.html">‹ Voltar ao início</a>
    <h1>Nova solicitação</h1>
    <p>Conte o que está acontecendo. Você receberá um protocolo para acompanhar depois.</p>
  </header>

  <main class="panel">
    <form id="formSolicitacao">
      <label for="nome">Nome completo *</label>
      <input id="nome" type="text" required autocomplete="name" placeholder="Digite seu nome">

      <label for="whatsapp">WhatsApp *</label>
      <input id="whatsapp" type="tel" required inputmode="tel" placeholder="Ex.: 51999999999">

      <label for="localidade">Localidade *</label>
      <input id="localidade" type="text" required placeholder="Ex.: Alto Alegre">

      <label for="assunto">Assunto *</label>
      <input id="assunto" type="text" required placeholder="Ex.: Estrada, iluminação, ponte...">

      <label for="descricao">Descreva sua solicitação *</label>
      <textarea id="descricao" required placeholder="Explique o problema e, se possível, indique um ponto de referência."></textarea>

      <label for="anexo">Foto ou arquivo</label>
      <input id="anexo" type="file" accept="image/*,.pdf">
      <div class="help">Opcional. Envie uma foto ou PDF que ajude a identificar a situação.</div>

      <button class="primary-btn" id="botaoEnviar" type="submit">ENVIAR SOLICITAÇÃO</button>
    </form>
    <div id="mensagem" class="notice"></div>
  </main>

  <div class="footer-note">Seus dados são usados para atendimento da solicitação pelo mandato.</div>

  <nav class="bottom-nav">
    <a class="nav-item" href="./index.html"><b>⌂</b>Início</a>
    <a class="nav-item active" href="./solicitacao.html"><b>＋</b>Solicitar</a>
    <a class="nav-item" href="./acompanhar.html"><b>⌕</b>Acompanhar</a>
    <a class="nav-item" href="../index.html"><b>•••</b>Mais</a>
  </nav>
</div>

<script>
const SUPABASE_URL="https://pmmsdjozyyxkbuqlkfpb.supabase.co";
const SUPABASE_KEY="sb_publishable_DA687gC36Y6UO3up6G8ZDA_OeLoqZk_";

document.getElementById("formSolicitacao").addEventListener("submit",async function(event){
  event.preventDefault();
  const botao=document.getElementById("botaoEnviar");
  const mensagem=document.getElementById("mensagem");
  botao.disabled=true; botao.textContent="ENVIANDO...";
  mensagem.className="notice"; mensagem.style.display="none";

  const dados={
    nome:document.getElementById("nome").value.trim(),
    whatsapp:document.getElementById("whatsapp").value.trim(),
    localidade:document.getElementById("localidade").value.trim(),
    assunto:document.getElementById("assunto").value.trim(),
    descricao:document.getElementById("descricao").value.trim()
  };

  try{
    const arquivo=document.getElementById("anexo").files[0];
    let caminhoAnexo=null;
    if(arquivo){
      const nomeArquivo=Date.now()+"-"+arquivo.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const upload=await fetch(SUPABASE_URL+"/storage/v1/object/anexos-solicitacoes/"+nomeArquivo,{
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":arquivo.type},
        body:arquivo
      });
      if(!upload.ok) throw new Error("Não foi possível enviar o anexo.");
      caminhoAnexo=nomeArquivo;
    }

    const resposta=await fetch(SUPABASE_URL+"/rest/v1/rpc/criar_solicitacao_com_anexos",{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation"},
      body:JSON.stringify({
        p_nome:dados.nome,p_whatsapp:dados.whatsapp,p_localidade:dados.localidade,
        p_assunto:dados.assunto,p_descricao:dados.descricao,p_anexos:caminhoAnexo?[caminhoAnexo]:[]
      })
    });
    const resultado=await resposta.json();
    if(!resposta.ok) throw new Error(resultado.message||resultado.error||"Não foi possível enviar.");
    const protocolo=typeof resultado==="string"?resultado:resultado.protocolo;

    mensagem.className="notice ok";
    mensagem.innerHTML="<strong>Solicitação enviada!</strong><br><br>Seu protocolo é <strong style='font-size:21px'>"+protocolo+"</strong><br><br>Guarde esse número para acompanhar o andamento.";
    this.reset();
  }catch(erro){
    mensagem.className="notice err";
    mensagem.textContent="Não foi possível enviar: "+erro.message;
  }finally{
    botao.disabled=false; botao.textContent="ENVIAR SOLICITAÇÃO";
  }
});
</script>
</body>
</html>
