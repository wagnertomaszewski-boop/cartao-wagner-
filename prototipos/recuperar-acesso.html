<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperação de acesso — protótipo</title>
<style>body{font:16px Arial,sans-serif;background:#eef4fa;color:#19324b;margin:0;padding:24px}.card{max-width:460px;margin:30px auto;background:white;padding:26px;border-radius:16px;box-shadow:0 8px 24px #1232}h1{font-size:24px}label{display:block;font-weight:bold;margin-top:18px}input{width:100%;box-sizing:border-box;padding:14px;margin-top:6px;border:1px solid #bac8d6;border-radius:9px;font-size:16px}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#0868bd;color:white;font-weight:bold;font-size:16px}button:disabled{background:#9ca9b6}.note{font-size:14px;color:#56697c;line-height:1.5}.status{margin-top:18px;line-height:1.5;color:#075ca7}</style></head>
<body><main class="card"><h1>🔑 Recuperar chave de acesso</h1><p class="note">Informe o protocolo e o WhatsApp utilizado na solicitação. A recuperação será analisada pelo administrador.</p><form id="recuperar"><label for="protocolo">Número do protocolo</label><input id="protocolo" required maxlength="40" autocomplete="off" placeholder="2026-000123"><label for="whatsapp">WhatsApp cadastrado</label><input id="whatsapp" type="tel" required inputmode="tel" maxlength="25" placeholder="(51) 99999-9999"><button type="submit">Solicitar recuperação</button><div class="status" id="status" role="status" aria-live="polite"></div></form><p class="note"><strong>Protótipo de desenvolvimento:</strong> o envio real está desativado até a implantação e validação da API segura. Não informa se o protocolo existe.</p></main>
<script>document.getElementById('recuperar').addEventListener('submit',function(e){e.preventDefault();const p=document.getElementById('protocolo').value.trim(),w=document.getElementById('whatsapp').value.replace(/\D/g,'');const s=document.getElementById('status');if(!p||w.length<10||w.length>13){s.textContent='Confira o protocolo e o número de WhatsApp.';return;}s.textContent='Protótipo: nenhum pedido foi enviado. Quando a função for ativada, você receberá uma confirmação genérica por aqui.';});</script></body></html>
