plugins { id 'com.android.application' }

// A chave de assinatura nunca fica no repositório. O workflow fornece os
// dados da chave permanente por variáveis de ambiente protegidas.
def arquivoChave = System.getenv('PAINEL_KEYSTORE_FILE')

android {
    namespace 'br.com.wagnertomaszewski.painelmandato'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'boolean', 'HOMOLOGACAO', 'false'
        manifestPlaceholders = [appName: 'Painel do Mandato']
        applicationId 'br.com.wagnertomaszewski.painelmandato'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '1.1.1'
    }
    signingConfigs {
        release {
            if (arquivoChave) {
                storeFile file(arquivoChave)
                storePassword System.getenv('PAINEL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PAINEL_KEY_ALIAS')
                keyPassword System.getenv('PAINEL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.homologacao'
            versionNameSuffix '-hml-bio1'
            buildConfigField 'boolean', 'HOMOLOGACAO', 'true'
            manifestPlaceholders = [appName: 'Painel do Mandato Homologação']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ensaios locais da variante isolada; nenhuma dependência extra no APK.
dependencies { testImplementation 'junit:junit:4.13.2' }
