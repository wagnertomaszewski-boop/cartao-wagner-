plugins { id 'com.android.application' }

// A chave de assinatura nunca fica no repositório. O workflow fornece os
// dados da chave permanente por variáveis de ambiente protegidas.
def arquivoChave = System.getenv('PAINEL_KEYSTORE_FILE')
// Homologação usa SOMENTE uma chave existente validada pelo workflow.
// Ausência de chave mantém a variante sem assinatura; nunca cai no debug.keystore temporário.
def chaveHml = System.getenv('PAINEL_HML_KEYSTORE_FILE')
def assinaturaHmlCompleta = ['PAINEL_HML_KEYSTORE_FILE','PAINEL_HML_KEYSTORE_PASSWORD','PAINEL_HML_KEY_ALIAS','PAINEL_HML_KEY_PASSWORD'].every { System.getenv(it) }

android {
    namespace 'br.com.wagnertomaszewski.painelmandato'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        buildConfigField 'boolean', 'HOMOLOGACAO', 'false'
        buildConfigField 'boolean', 'CIDADAO_HML', 'false'
        buildConfigField 'boolean', 'BIOMETRIA_PLAY', 'false'
        manifestPlaceholders = [appName: 'Painel do Mandato']
        applicationId 'br.com.wagnertomaszewski.painelmandato'
        minSdk 24
        targetSdk 36
        versionCode (System.getenv('PAINEL_VERSION_CODE') ?: '3').toInteger()
        versionName '1.1.1'
    }
    signingConfigs {
        hmlExistente {
            if (assinaturaHmlCompleta) {
                storeFile file(chaveHml)
                storePassword System.getenv('PAINEL_HML_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PAINEL_HML_KEY_ALIAS')
                keyPassword System.getenv('PAINEL_HML_KEY_PASSWORD')
            }
        }
        release {
            if (arquivoChave) {
                storeFile file(arquivoChave)
                storePassword System.getenv('PAINEL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PAINEL_KEY_ALIAS')
                keyPassword System.getenv('PAINEL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig assinaturaHmlCompleta ? signingConfigs.hmlExistente : null
            applicationIdSuffix '.homologacao'
            versionNameSuffix '-hml-bio1'
            buildConfigField 'boolean', 'HOMOLOGACAO', 'true'
            manifestPlaceholders = [appName: 'Painel do Mandato Homologação']
        }
        cidadaoHml {
            initWith debug
            applicationIdSuffix '.cidadao.homologacao'
            versionNameSuffix '-cidadao-hml-bio1'
            buildConfigField 'boolean', 'CIDADAO_HML', 'true'
            manifestPlaceholders = [appName: 'Mandato em Ação Homologação']
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        playCandidato {
            initWith release
            // Mesmo aplicativo; sem sufixo .homologacao. Não é distribuído automaticamente.
            debuggable false
            signingConfig null
            versionNameSuffix '-candidata-bio'
            buildConfigField 'boolean', 'BIOMETRIA_PLAY', 'true'
            matchingFallbacks = ['release']
        }
    }
    sourceSets {
        cidadaoHml {
            java.srcDirs += 'src/debug/java'
            manifest.srcFile 'src/debug/AndroidManifest.xml'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Ensaios locais da variante isolada; nenhuma dependência extra no APK.
dependencies { testImplementation 'junit:junit:4.13.2' }
