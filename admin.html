<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#061c31">
  <link rel="manifest" href="./manifest-admin.json">
  <title>Painel Administrativo | Wagner Tomaszewski</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#17202a}
    header{display:none;background:#071f31;color:#fff;padding:24px 16px;text-align:center}
    header h1{margin:0 0 6px;font-size:28px}
    header p{margin:0;color:#cbd5df}
    main{display:none}
    .container{max-width:800px;margin:auto;padding:20px}
    .titulo{margin:20px 0;font-size:28px}
    .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px rgba(0,0,0,.10);border-left:5px solid #0b7a45}
    .protocolo{color:#0b7a45;font-weight:bold;font-size:17px;margin-bottom:12px}
    .linha{margin:7px 0;line-height:1.4}
    .descricao{background:#f5f7f8;padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap}
    select,#filtroBusca,#telaLogin input,textarea,input[type="file"]{width:100%;padding:12px;margin-top:12px;border-radius:8px;border:1px solid #bbb;font-size:16px;background:#fff}
    textarea{min-height:105px;resize:vertical;font-family:Arial,sans-serif}
    button{width:100%;border:0;padding:13px;border-radius:8px;margin-top:10px;font-size:16px;font-weight:bold;background:#0b7a45;color:#fff;cursor:pointer}
    button:disabled{opacity:.6}
    .vazio{text-align:center;background:#fff;padding:30px;border-radius:12px}
    .erro{background:#ffe6e6;color:#8b0000;padding:15px;border-radius:10px;line-height:1.45;margin-top:12px}
    .erro button{max-width:260px}
    .status{font-weight:bold;color:#0b7a45}
    .respostas-box{margin-top:16px;padding:14px;border-radius:10px;background:#eef6f1;border:1px solid #c9e3d2}
    .respostas-box h4{margin:0 0 10px;color:#0b7a45}
    .resposta-item{background:#fff;border-radius:9px;padding:12px;margin-top:9px;border-left:4px solid #0b7a45}
    .resposta-data{font-size:12px;color:#667085;margin-bottom:6px}
    .resposta-texto{white-space:pre-wrap;line-height:1.45}
    .anexos{margin-top:8px}
    .anexos a{display:inline-block;margin:4px 8px 0 0;color:#075985;font-weight:bold;text-decoration:none}
    .nova-resposta{margin-top:16px;padding-top:12px;border-top:1px solid #d8dee4}
    .sem-resposta{color:#667085;font-size:14px}
    #telaLogin{display:block;padding:24px;max-width:520px;margin:30px auto;background:#fff;border-radius:14px}
    #erroLogin{line-height:1.4;color:#8b0000}
  </style>
</head>
<body>
  <div id="telaLogin">
    <h2>Acesso ao Painel</h2>
    <input id="emailLogin" type="email" placeholder="E-mail" autocomplete="email">
    <input id="senhaLogin" type="password" placeholder="Senha" autocomplete="current-password">
    <button id="btnLogin" type="button">ENTRAR</button>
    <p id="erroLogin"></p>
  </div>

  <header>
    <h1>Painel Administrativo</h1>
    <p>Solicitações recebidas • Wagner Tomaszewski</p>
    <button id="btnSair" type="button">Sair</button>
  </header>

  <main class="container">
    <h2 class="titulo">Solicitações da comunidade</h2>

    <input id="filtroBusca" type="text" placeholder="Buscar por nome ou protocolo">

    <select id="filtroStatus">
      <option value="Todos">Todos os status</option>
      <option value="Recebida">Recebida</option>
      <option value="Recebido">Recebido</option>
      <option value="Em análise">Em análise</option>
      <option value="Encaminhado">Encaminhado</option>
      <option value="Em andamento">Em andamento</option>
      <option value="Concluído">Concluído</option>
    </select>

    <div id="lista">Carregando solicitações...</div>
  </main>

<script>
const SUPABASE_URL = "https://pmmsdjozyyxkbuqlkfpb.supabase.co";
const SUPABASE_KEY = "sb_publishable_DA687gC36Y6UO3up6G8ZDA_OeLoqZk_";
const STORAGE_KEY = "wagner_admin_session_v2";
const TEMPO_LIMITE_MS = 15000;

function salvarSessao(sessao){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sessao));
}

function lerSessao(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  }catch(e){
    return null;
  }
}

function limparSessao(){
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem("sb-pmmsdjozyyxkbuqlkfpb-auth-token");
}

async function requisicao(url, opcoes = {}) {
  const controlador = new AbortController();
  const timer = setTimeout(() => controlador.abort(), TEMPO_LIMITE_MS);

  try {
    return await fetch(url, { ...opcoes, signal: controlador.signal });
  } catch (e) {
    if (e && e.name === "AbortError") {
      throw new Error("Tempo esgotado ao conectar com o servidor.");
    }
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

function mensagemDeErro(erro) {
  const msg = String((erro && erro.message) || erro || "").toLowerCase();

  if (
    msg.includes("invalid login credentials") ||
    msg.includes("invalid_credentials") ||
    msg.includes("email or password")
  ) {
    return "E-mail ou senha incorretos.";
  }

  if (
    msg.includes("failed to fetch") ||
    msg.includes("network") ||
    msg.includes("tempo esgotado") ||
    msg.includes("load failed")
  ) {
    return "Não foi possível conectar ao servidor. Confira sua internet e tente novamente.";
  }

  return (erro && erro.message) ? erro.message : "Não foi possível concluir a operação. Tente novamente.";
}

function esc(v) {
  if (v === null || v === undefined || v === "") return "Não informado";
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function normalizar(v) {
  return String(v || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim();
}

function formatarData(v) {
  if (!v) return "";
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("pt-BR");
}

function normalizarAnexos(v) {
  if (Array.isArray(v)) return v;
  if (!v) return [];
  try {
    const p = JSON.parse(v);
    return Array.isArray(p) ? p : [];
  } catch (e) {
    return [];
  }
}

function caminhoPublicoStorage(bucket, caminho) {
  const partes = String(caminho || "").split("/").filter(Boolean).map(encodeURIComponent);
  return SUPABASE_URL + "/storage/v1/object/public/" + encodeURIComponent(bucket) + "/" + partes.join("/");
}

function mostrarLogin(mensagem = "") {
  document.getElementById("telaLogin").style.display = "block";
  document.querySelector("header").style.display = "none";
  document.querySelector("main").style.display = "none";
  document.getElementById("erroLogin").textContent = mensagem;
}

function mostrarPainel() {
  document.getElementById("telaLogin").style.display = "none";
  document.querySelector("header").style.display = "block";
  document.querySelector("main").style.display = "block";
}

async function renovarSessao(refreshToken) {
  const resposta = await requisicao(
    SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ refresh_token: refreshToken })
    }
  );

  const dados = await resposta.json().catch(() => ({}));

  if (!resposta.ok) {
    throw new Error(dados.msg || dados.message || dados.error_description || "Sessão expirada.");
  }

  const sessao = {
    access_token: dados.access_token,
    refresh_token: dados.refresh_token || refreshToken,
    expires_at: Date.now() + ((dados.expires_in || 3600) * 1000)
  };
  salvarSessao(sessao);
  return sessao;
}

async function obterSessaoValida() {
  let sessao = lerSessao();
  if (!sessao || !sessao.access_token) return null;

  if (sessao.expires_at && Date.now() > sessao.expires_at - 60000) {
    if (!sessao.refresh_token) return null;
    sessao = await renovarSessao(sessao.refresh_token);
  }
  return sessao;
}

async function fazerLogin() {
  const email = document.getElementById("emailLogin").value.trim();
  const senha = document.getElementById("senhaLogin").value;
  const erroEl = document.getElementById("erroLogin");
  const botao = document.getElementById("btnLogin");

  erroEl.textContent = "";

  if (!email || !senha) {
    erroEl.textContent = "Digite seu e-mail e sua senha.";
    return;
  }

  botao.disabled = true;
  botao.textContent = "ENTRANDO...";

  try {
    const resposta = await requisicao(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email, password: senha })
      }
    );

    const dados = await resposta.json().catch(() => ({}));

    if (!resposta.ok) {
      throw new Error(dados.msg || dados.message || dados.error_description || "Não foi possível entrar.");
    }

    salvarSessao({
      access_token: dados.access_token,
      refresh_token: dados.refresh_token,
      expires_at: Date.now() + ((dados.expires_in || 3600) * 1000)
    });

    document.getElementById("senhaLogin").value = "";
    mostrarPainel();
    await carregarSolicitacoes();

  } catch (e) {
    console.error("Erro de login:", e);
    erroEl.textContent = mensagemDeErro(e);
  } finally {
    botao.disabled = false;
    botao.textContent = "ENTRAR";
  }
}

async function carregarSolicitacoes() {
  const lista = document.getElementById("lista");
  lista.textContent = "Carregando solicitações...";

  try {
    const sessao = await obterSessaoValida();
    if (!sessao) {
      limparSessao();
      mostrarLogin("Sua sessão expirou. Entre novamente.");
      return;
    }

    const filtroStatus = document.getElementById("filtroStatus").value;
    const termoBusca = normalizar(document.getElementById("filtroBusca").value);

    let url = SUPABASE_URL + "/rest/v1/solicitacoes?select=*&order=id.desc";
    if (filtroStatus !== "Todos") {
      url += "&status=eq." + encodeURIComponent(filtroStatus);
    }

    const resposta = await requisicao(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + sessao.access_token
      }
    });

    const dadosResposta = await resposta.json().catch(() => ([]));

    if (resposta.status === 401) {
      limparSessao();
      mostrarLogin("Sua sessão expirou. Entre novamente.");
      return;
    }

    if (!resposta.ok) {
      throw new Error(
        dadosResposta.message ||
        dadosResposta.hint ||
        dadosResposta.details ||
        "Não foi possível carregar as solicitações."
      );
    }

    let dados = Array.isArray(dadosResposta) ? dadosResposta : [];

    const respostasPorSolicitacao = {};
    try {
      const respostaRespostas = await requisicao(
        SUPABASE_URL + "/rest/v1/respostas_solicitacoes?select=*&order=criado_em.desc",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + sessao.access_token
          }
        }
      );

      if (respostaRespostas.ok) {
        const respostas = await respostaRespostas.json().catch(() => []);
        (Array.isArray(respostas) ? respostas : []).forEach(r => {
          const chave = Number(r.solicitacao_id);
          if (!respostasPorSolicitacao[chave]) respostasPorSolicitacao[chave] = [];
          respostasPorSolicitacao[chave].push(r);
        });
      } else {
        console.warn("Histórico de respostas ainda não está disponível.");
      }
    } catch (e) {
      console.warn("Não foi possível carregar respostas:", e);
    }

    if (termoBusca) {
      dados = dados.filter(item =>
        normalizar(item.nome).includes(termoBusca) ||
        normalizar(item.protocolo).includes(termoBusca)
      );
    }

    if (dados.length === 0) {
      lista.innerHTML = '<div class="vazio">Nenhuma solicitação encontrada.</div>';
      return;
    }

    lista.innerHTML = "";

    dados.forEach(item => {
      const id = Number(item.id);
      const status = item.status || "Recebida";
      const telefone = String(item.whatsapp || "").replace(/\D/g, "");
      const whatsapp = telefone.startsWith("55") ? telefone : "55" + telefone;

      const card = document.createElement("div");
      card.className = "card";

      const respostas = respostasPorSolicitacao[id] || [];
      const historicoRespostas = respostas.length
        ? respostas.map(r => {
            const anexos = normalizarAnexos(r.anexos);
            const links = anexos.length
              ? '<div class="anexos">' + anexos.map(a => {
                  const nome = esc(a.nome || "Documento");
                  const url = esc(a.url || "");
                  return url ? '<a href="' + url + '" target="_blank" rel="noopener">📎 ' + nome + '</a>' : "";
                }).join("") + '</div>'
              : "";
            return '<div class="resposta-item">' +
              '<div class="resposta-data">' + esc(formatarData(r.criado_em)) + '</div>' +
              (r.mensagem ? '<div class="resposta-texto">' + esc(r.mensagem) + '</div>' : '') +
              links +
            '</div>';
          }).join("")
        : '<div class="sem-resposta">Nenhuma resposta enviada ainda.</div>';

      card.innerHTML = `
        <div class="protocolo">${esc(item.protocolo || ("Solicitação #" + id))}</div>
        <div class="linha"><strong>Nome:</strong> ${esc(item.nome)}</div>
        <div class="linha"><strong>WhatsApp:</strong> ${esc(item.whatsapp)}</div>
        <div class="linha"><strong>Localidade:</strong> ${esc(item.localidade)}</div>
        <div class="linha"><strong>Assunto:</strong> ${esc(item.assunto)}</div>
        <div class="descricao"><strong>Descrição:</strong><br>${esc(item.descricao)}</div>
        <div class="linha"><strong>Status atual:</strong> <span class="status">${esc(status)}</span></div>

        <select id="status-${id}">
          ${["Recebida","Recebido","Em análise","Encaminhado","Em andamento","Concluído"]
            .map(s => `<option value="${s}" ${s === status ? "selected" : ""}>${s}</option>`)
            .join("")}
        </select>

        <button id="botao-${id}" type="button" onclick="atualizarStatus(${id})">Salvar novo status</button>

        <div class="respostas-box">
          <h4>Respostas ao cidadão</h4>
          ${historicoRespostas}

          <div class="nova-resposta">
            <label for="resposta-${id}"><strong>Nova resposta</strong></label>
            <textarea id="resposta-${id}" placeholder="Digite a resposta que ficará visível para o cidadão ao consultar o protocolo."></textarea>

            <label for="documentos-${id}"><strong>Anexar documentos (opcional)</strong></label>
            <input
              type="file"
              id="documentos-${id}"
              multiple
              accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.odt,.ods"
            >

            <button id="btn-resposta-${id}" type="button" onclick="enviarResposta(${id})">
              Enviar resposta / documentos
            </button>
          </div>
        </div>

        ${whatsapp.length > 2
          ? `<a href="https://wa.me/${whatsapp}" target="_blank" rel="noopener"><button type="button">Falar pelo WhatsApp</button></a>`
          : ""}
      `;

      lista.appendChild(card);
    });

  } catch (e) {
    console.error("Erro ao carregar solicitações:", e);
    lista.innerHTML = `
      <div class="erro">
        <strong>Não foi possível carregar as solicitações.</strong><br>
        ${esc(mensagemDeErro(e))}<br>
        <button type="button" onclick="carregarSolicitacoes()">Tentar novamente</button>
      </div>
    `;
  }
}

async function enviarResposta(id) {
  const campo = document.getElementById(`resposta-${id}`);
  const arquivosEl = document.getElementById(`documentos-${id}`);
  const botao = document.getElementById(`btn-resposta-${id}`);
  if (!campo || !arquivosEl || !botao) return;

  const mensagem = campo.value.trim();
  const arquivos = Array.from(arquivosEl.files || []);

  if (!mensagem && arquivos.length === 0) {
    alert("Digite uma resposta ou selecione pelo menos um documento.");
    return;
  }

  if (arquivos.length > 5) {
    alert("Envie no máximo 5 documentos por resposta.");
    return;
  }

  for (const arquivo of arquivos) {
    if (arquivo.size > 10 * 1024 * 1024) {
      alert("O arquivo " + arquivo.name + " ultrapassa o limite de 10 MB.");
      return;
    }
  }

  botao.disabled = true;
  botao.textContent = "Enviando...";

  try {
    const sessao = await obterSessaoValida();
    if (!sessao) throw new Error("Sua sessão expirou. Entre novamente.");

    const anexos = [];

    for (const arquivo of arquivos) {
      const nomeSeguro = arquivo.name.replace(/[^a-zA-Z0-9._-]/g, "_");
      const caminho = id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + nomeSeguro;

      const upload = await requisicao(
        SUPABASE_URL + "/storage/v1/object/documentos-respostas/" +
          caminho.split("/").map(encodeURIComponent).join("/"),
        {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + sessao.access_token,
            "Content-Type": arquivo.type || "application/octet-stream",
            "x-upsert": "false"
          },
          body: arquivo
        }
      );

      if (!upload.ok) {
        const detalhe = await upload.text().catch(() => "");
        throw new Error("Não foi possível enviar o documento " + arquivo.name + ". " + detalhe);
      }

      anexos.push({
        nome: arquivo.name,
        tipo: arquivo.type || "",
        caminho: caminho,
        url: caminhoPublicoStorage("documentos-respostas", caminho)
      });
    }

    const resposta = await requisicao(
      SUPABASE_URL + "/rest/v1/respostas_solicitacoes",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + sessao.access_token,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({
          solicitacao_id: id,
          mensagem: mensagem || null,
          anexos: anexos
        })
      }
    );

    const dados = await resposta.json().catch(() => []);

    if (!resposta.ok) {
      throw new Error(
        dados.message ||
        dados.hint ||
        dados.details ||
        "Não foi possível registrar a resposta."
      );
    }

    alert("Resposta enviada com sucesso!");
    campo.value = "";
    arquivosEl.value = "";
    await carregarSolicitacoes();

  } catch (e) {
    console.error("Erro ao enviar resposta:", e);
    alert(mensagemDeErro(e));
  } finally {
    botao.disabled = false;
    botao.textContent = "Enviar resposta / documentos";
  }
}

async function atualizarStatus(id) {
  const seletor = document.getElementById(`status-${id}`);
  const botao = document.getElementById(`botao-${id}`);
  if (!seletor || !botao) return;

  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const sessao = await obterSessaoValida();
    if (!sessao) throw new Error("Sua sessão expirou. Entre novamente.");

    const resposta = await requisicao(
      SUPABASE_URL + "/rest/v1/solicitacoes?id=eq." + encodeURIComponent(id),
      {
        method: "PATCH",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + sessao.access_token,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },
        body: JSON.stringify({ status: seletor.value })
      }
    );

    const dados = await resposta.json().catch(() => ([]));

    if (!resposta.ok) {
      throw new Error(
        dados.message ||
        dados.hint ||
        dados.details ||
        "Não foi possível atualizar o status."
      );
    }

    if (!Array.isArray(dados) || dados.length === 0) {
      throw new Error("O servidor não permitiu alterar este registro.");
    }

    alert("Status atualizado com sucesso!");
    await carregarSolicitacoes();

  } catch (e) {
    console.error("Erro ao atualizar status:", e);
    alert(mensagemDeErro(e));
  } finally {
    botao.disabled = false;
    botao.textContent = "Salvar novo status";
  }
}

async function verificarLogin() {
  try {
    const sessao = await obterSessaoValida();
    if (!sessao) {
      mostrarLogin("");
      return;
    }

    mostrarPainel();
    await carregarSolicitacoes();

  } catch (e) {
    limparSessao();
    mostrarLogin(mensagemDeErro(e));
  }
}

function sair() {
  limparSessao();
  document.getElementById("senhaLogin").value = "";
  mostrarLogin("");
}

document.getElementById("btnLogin").addEventListener("click", fazerLogin);
document.getElementById("senhaLogin").addEventListener("keydown", e => {
  if (e.key === "Enter") fazerLogin();
});

document.getElementById("filtroStatus").addEventListener("change", carregarSolicitacoes);

let atrasoBusca;
document.getElementById("filtroBusca").addEventListener("input", () => {
  clearTimeout(atrasoBusca);
  atrasoBusca = setTimeout(carregarSolicitacoes, 350);
});

document.getElementById("btnSair").addEventListener("click", sair);

verificarLogin();
</script>
</body>
</html>
