<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo | Wagner Tomaszewski</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f8;
      color: #17202a;
    }

    header {
      background: #071a2b;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 5px;
      font-size: 26px;
    }

    header p {
      margin: 0;
      color: #cbd5df;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 18px;
    }

    .titulo {
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      border-left: 5px solid #0b7a45;
    }

    .protocolo {
      color: #0b7a45;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 12px;
    }

    .linha {
      margin: 7px 0;
      line-height: 1.4;
    }

    .descricao {
      background: #f5f7f8;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    select {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 1px solid #bbb;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      border: none;
      padding: 13px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      background: #0b7a45;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .vazio {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    .erro {
      background: #ffe6e6;
      color: #8b0000;
      padding: 15px;
      border-radius: 10px;
    }

    .status {
      font-weight: bold;
      color: #0b7a45;
    }
  </style>
</
