<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="./manifest-admin.json">
<meta name="theme-color" content="#061c31"> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo | Wagner Tomaszewski</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#17202a}
    header{background:#071f31;color:#fff;padding:24px 16px;text-align:center}
    header h1{margin:0 0 6px;font-size:28px}
    header p{margin:0;color:#cbd5df}
    .container{max-width:800px;margin:auto;padding:20px}
    .titulo{margin:20px 0;font-size:28px}
    .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;
      box-shadow:0 3px 12px rgba(0,0,0,.10);border-left:5px solid #0b7a45}
    .protocolo{color:#0b7a45;font-weight:bold;font-size:17px;margin-bottom:12px}
    .linha{margin:7px 0;line-height:1.4}
    .descricao{background:#f5f7f8;padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap}
    select{width:100%;padding:12px;margin-top:12px;border-radius:8px;border:1px solid #bbb;font-size:16px;background:#fff}
    button{width:100%;border:0;padding:13px;border-radius:8px;margin-top:10px;font-size:16px;
      font-weight:bold;background:#0b7a45;color:#fff;cursor:pointer}
    button:disabled{opacity:.6}
    .vazio{text-align:center;background:#fff;padding:30px;border-radius:12px}
    .erro{background:#ffe6e6;color:#8b0000;padding:15px;border-radius:10px;line-height:1.45}
    .status{font-weight:bold;color:#0b7a45}
  </style>
</head>
<body>
  <div id="telaLogin">
  <h2>Acesso ao Painel</h2>
  <input id="emailLogin" type="email" placeholder="E-mail">
  <input id="senhaLogin" type="password" placeholder="Senha">
  <button id="btnLogin">ENTRAR</button>
  <p id="erroLogin"></p>
  </div>
  <header>
  <h1>Painel Administrativo</h1>
  <p>Solicitações recebidas • Wagner Tomaszewski</p>
    <button id="btnSair" type="button">Sair</button>
</header>

<main class="container">
    <h2 class="titulo">Solicitações da comunidade</h2>
<input id="filtroBusca" type="text" placeholder="Buscar por nome ou protocolo">
    <select id="filtroStatus">
        <option value="Todos">Todos os status</option>
        <option value="Recebida">Recebida</option>
        <option value="Em análise">Em análise</option>
        <option value="Encaminhado">Encaminhado</option>
        <option value="Em andamento">Em andamento</option>
        <option value="Concluído">Concluído</option>
    </select>

    <div id="lista">Carregando solicitações...</div>
</main>

<script>
const SUPABASE_URL = "https://pmmsdjozyyxkbuqlkfpb.supabase.co";
const SUPABASE_KEY = "sb_publishable_DA687gC36Y6UO3up6G8ZDA_OeLoqZk_";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function fazerLogin() {
  const email = document.getElementById("emailLogin").value.trim();
  const senha = document.getElementById("senhaLogin").value;
  const erro = document.getElementById("erroLogin");

  erro.textContent = "";

  const { error } = await client.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    erro.textContent = "E-mail ou senha incorretos.";
    return;
  }

  document.getElementById("telaLogin").style.display = "none";
  carregarSolicitacoes();
}

document.getElementById("btnLogin").addEventListener("click", fazerLogin);
const esc = (v) => {
  if (v === null || v === undefined || v === "") return "Não informado";
  return String(v).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
};

async function carregarSolicitacoes(){
  const lista = document.getElementById("lista");
  lista.textContent = "Carregando solicitações...";

  try {
   const filtroStatus = document.getElementById("filtroStatus").value;

let consulta = client
  .from("solicitacoes")
  .select("*")
  .order("id", { ascending: false });

if (filtroStatus !== "Todos") {
  consulta = consulta.eq("status", filtroStatus);
}

const { data, error } = await consulta; 

    if (error) throw error;

    if (!data || data.length === 0){
      lista.innerHTML = '<div class="vazio">Nenhuma solicitação encontrada.</div>';
      return;
    }

    lista.innerHTML = "";

    data.forEach(item => {
      const id = Number(item.id);
      const status = item.status || "Recebido";
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <div class="protocolo">${esc(item.protocolo || ("Solicitação #" + id))}</div>
        <div class="linha"><strong>Nome:</strong> ${esc(item.nome)}</div>
        <div class="linha"><strong>WhatsApp:</strong> ${esc(item.whatsapp)}</div>
        <div class="linha"><strong>Localidade:</strong> ${esc(item.localidade)}</div>
        <div class="linha"><strong>Assunto:</strong> ${esc(item.assunto)}</div>
        <div class="descricao"><strong>Descrição:</strong><br>${esc(item.descricao)}</div>
        <div class="linha"><strong>Status atual:</strong> <span class="status">${esc(status)}</span></div>
        <select id="status-${id}">
          ${["Recebido","Em análise","Encaminhado","Em andamento","Concluído"]
            .map(s => `<option value="${s}" ${s===status?"selected":""}>${s}</option>`).join("")}
        </select>
        <button id="botao-${id}" onclick="atualizarStatus(${id})">Salvar novo status</button>
    <a <a href="https://wa.me/${String(item.whatsapp).replace(/\D/g,'').replace(/^55/,'').replace(/^/,'55')}" target="_blank"><button type="button">Falar pelo WhatsApp</button></a>
      `;
      lista.appendChild(card);
    });
  } catch (e) {
    console.error(e);
    lista.innerHTML = `<div class="erro"><strong>Não foi possível carregar as solicitações.</strong><br>
    ${esc(e.message || e)}<br><br>Confira a conexão com o Supabase e as permissões da tabela.</div>`;
  }
}

async function atualizarStatus(id){
  const seletor = document.getElementById(`status-${id}`);
  const botao = document.getElementById(`botao-${id}`);
  if (!seletor || !botao) return;

  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const novoStatus = seletor.value;
const { data, error } = await client
  .from("solicitacoes")
  .update({
  status: novoStatus
})
    
  
  .eq("id", id)
  .select();

console.log("RETORNO UPDATE:", data, error);

if (error) throw error;

if (!data || data.length === 0) {
  throw new Error("O Supabase não permitiu alterar este registro.");
}
    
    alert("Status atualizado com sucesso!");
    await carregarSolicitacoes();
  } catch (e) {
    console.error(e);
    alert("Erro ao atualizar o status: " + (e.message || e));
    botao.disabled = false;
    botao.textContent = "Salvar novo status";
  }
}
async function verificarLogin() {
  const { data: { session } } = await client.auth.getSession();

  if (!session) {
    document.getElementById("telaLogin").style.display = "block";
    return;
  }

  document.getElementById("telaLogin").style.display = "none";
  carregarSolicitacoes();
}

  document.getElementById("filtroStatus").addEventListener("change", () => {
  carregarSolicitacoes();
});
document.getElementById("filtroBusca").addEventListener("input", () => {
  carregarSolicitacoes();
});
  document.getElementById("btnSair").addEventListener("click", async () => {
  await client.auth.signOut();
  document.getElementById("telaLogin").style.display = "block";
});
  verificarLogin();  
</script>
</body>
</html>
