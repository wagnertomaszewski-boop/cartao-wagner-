name: Painel do Mandato - Play Store (teste interno)

on:
  push:
    branches: [candidate/painel-biometria-assinada]
    paths: [.github/workflows/painel-playstore-interno.yml, 'android-painel/app/src/playCandidato/**']
  workflow_dispatch:
    inputs:
      ultimo_codigo:
        description: Maior versionCode registrado no Painel na Play Console
        required: true
        type: string
      upload_sha256:
        description: SHA-256 do certificado de upload do Painel (publico)
        required: true
        type: string

permissions:
  contents: read

jobs:
  gerar-aab:
    if: github.ref == 'refs/heads/candidate/painel-biometria-assinada'
    name: Gerar candidata biometrica assinada
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Preparar Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'

      - name: Carregar assinatura privada
        env:
          ULTIMO_CODIGO: ${{ inputs.ultimo_codigo || '3' }}
          UPLOAD_SHA256: ${{ inputs.upload_sha256 || 'E3:3F:D6:DF:8F:53:4A:33:E1:74:0F:0C:50:1F:31:0A:B4:8E:6F:47:78:55:E4:C4:90:BE:AC:A9:80:EC:DA:59' }}
          KEYSTORE_B64: ${{ secrets.PAINEL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PAINEL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAINEL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAINEL_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo 'Faltam os quatro GitHub Actions Secrets PAINEL_* da assinatura.' >&2
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/painel-assinatura"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/painel-assinatura/upload.jks"
          test -s "$RUNNER_TEMP/painel-assinatura/upload.jks"
          [[ "$ULTIMO_CODIGO" =~ ^[1-9][0-9]{0,9}$ ]] && (( ULTIMO_CODIGO < 2100000000 ))
          esperado="$(printf '%s' "$UPLOAD_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$esperado" =~ ^[0-9a-f]{64}$ ]]
          keytool -exportcert -keystore "$RUNNER_TEMP/painel-assinatura/upload.jks" \
            -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD \
            -file "$RUNNER_TEMP/painel-assinatura/cert.der"
          real="$(sha256sum "$RUNNER_TEMP/painel-assinatura/cert.der" | cut -d' ' -f1)"
          if [[ "$real" != "$esperado" ]]; then
            echo 'Certificado de upload diferente do informado na Play Console.' >&2
            exit 1
          fi
          echo "PAINEL_VERSION_CODE=$((ULTIMO_CODIGO+1))" >> "$GITHUB_ENV"

      - name: Testar e compilar candidata biometrica
        working-directory: android-painel
        env:
          PAINEL_ASSINAR_CANDIDATA: '1'
          PAINEL_KEYSTORE_FILE: ${{ runner.temp }}/painel-assinatura/upload.jks
          PAINEL_KEYSTORE_PASSWORD: ${{ secrets.PAINEL_KEYSTORE_PASSWORD }}
          PAINEL_KEY_ALIAS: ${{ secrets.PAINEL_KEY_ALIAS }}
          PAINEL_KEY_PASSWORD: ${{ secrets.PAINEL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testPlayCandidatoUnitTest :app:bundlePlayCandidato

      - name: Verificar assinatura do AAB
        run: |
          LC_ALL=C jarsigner -verify android-painel/app/build/outputs/bundle/playCandidato/app-playCandidato.aab | tee "$RUNNER_TEMP/painel-verificacao.txt"
          grep -Fx 'jar verified.' "$RUNNER_TEMP/painel-verificacao.txt"

      - name: Disponibilizar AAB de teste, sem envio a Play
        uses: actions/upload-artifact@v4
        with:
          name: Painel-do-Mandato-Biometria-Assinado
          path: android-painel/app/build/outputs/bundle/playCandidato/app-playCandidato.aab
          if-no-files-found: error
          retention-days: 14
