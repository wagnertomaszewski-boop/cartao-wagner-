name: Painel V17 - Gerar APK Android

on:
  push:
    paths:
      - "android-painel/**"
      - ".github/workflows/painel-v17-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
      - name: Android plataforma e ferramentas
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK Android
        working-directory: android-painel
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Renomear APK
        run: cp android-painel/app/build/outputs/apk/debug/app-debug.apk Painel_do_Mandato_V17.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Painel-do-Mandato-V17-APK
          path: Painel_do_Mandato_V17.apk
          retention-days: 30
