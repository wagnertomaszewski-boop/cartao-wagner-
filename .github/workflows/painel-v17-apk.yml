name: Painel V17 - Gerar APK Android

on:
  push:
    paths:
      - "android-painel/**"
      - ".github/workflows/painel-v17-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK disponivel no runner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK no runner: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK Android
        working-directory: android-painel
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Renomear APK
        run: cp android-painel/app/build/outputs/apk/debug/app-debug.apk Painel_do_Mandato_V17_Lembretes.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Painel-do-Mandato-V17-Lembretes-APK
          path: Painel_do_Mandato_V17_Lembretes.apk
          retention-days: 30
