name: Painel Homologacao - APK DEBUG (nao publicar)

on:
  push:
    paths:
      - "android-painel/**"
      - ".github/workflows/painel-v17-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK disponivel no runner
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK no runner: $SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar APK Android
        working-directory: android-painel
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:testCidadaoHmlUnitTest :app:assembleDebug :app:assembleCidadaoHml :app:compileReleaseJavaWithJavac :app:processReleaseMainManifest
      - name: Renomear APK
        run: |
          cp android-painel/app/build/outputs/apk/debug/app-debug.apk Painel_do_Mandato_Homologacao_Debug.apk
          cp android-painel/app/build/outputs/apk/cidadaoHml/app-cidadaoHml.apk Mandato_em_Acao_Cidadao_Homologacao.apk
      - name: Conferir identidade isolada do APK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/aapt" dump badging Painel_do_Mandato_Homologacao_Debug.apk > /tmp/apk-hml-badging.txt
          "$SDK/build-tools/35.0.0/aapt" dump badging Mandato_em_Acao_Cidadao_Homologacao.apk > /tmp/apk-cidadao-hml-badging.txt
          python - <<'PYCODE'
          from pathlib import Path
          texto = Path('/tmp/apk-hml-badging.txt').read_text()
          assert "package: name='br.com.wagnertomaszewski.painelmandato.homologacao'" in texto
          assert 'application-debuggable' in texto
          assert 'android.permission.ACCESS_FINE_LOCATION' in texto
          assert 'android.permission.USE_BIOMETRIC' in texto
          cidadao = Path('/tmp/apk-cidadao-hml-badging.txt').read_text()
          assert "package: name='br.com.wagnertomaszewski.painelmandato.cidadao.homologacao'" in cidadao
          assert 'application-debuggable' in cidadao and 'android.permission.USE_BIOMETRIC' in cidadao
          manifests = [p for p in Path('android-painel/app/build/intermediates').rglob('AndroidManifest.xml') if 'release' in p.parts]
          assert manifests, 'Manifesto release não foi processado para conferência'
          assert all('ACCESS_FINE_LOCATION' not in p.read_text() and 'ACCESS_COARSE_LOCATION' not in p.read_text() and 'USE_BIOMETRIC' not in p.read_text() and 'USE_FINGERPRINT' not in p.read_text() for p in manifests), 'Permissão de teste não pode entrar em release'
          print('APK isolado de homologação confirmado; nenhum app publicado foi alterado.')
          PYCODE
      - name: Evidências dos testes JVM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Testes-Biometria-Homologacao
          path: |
            android-painel/app/build/test-results/testDebugUnitTest/
            android-painel/app/build/test-results/testCidadaoHmlUnitTest/
          retention-days: 30
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Painel-Homologacao-DEBUG-NAO-PUBLICAR
          path: Painel_do_Mandato_Homologacao_Debug.apk
          retention-days: 30

      - name: Disponibilizar APK cidadão isolado
        uses: actions/upload-artifact@v4
        with:
          name: Mandato-Cidadao-Homologacao-NAO-PUBLICAR
          path: Mandato_em_Acao_Cidadao_Homologacao.apk
          retention-days: 30
