name: Homologacao HTTP Neon isolada
# Não usa segredos legados nem executa SQL fora da branch isolada.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/recuperacao-whatsapp-manual
    paths:
      - '.github/workflows/homologacao-http-neon.yml'
      - 'homologacao/api-neon/**'
      - 'v2/index.html'
      - 'render-homologacao.yaml'
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes originais HTTP e PostgreSQL simulado
        run: node --test homologacao/api-neon/integracao-http-postgres.test.mjs homologacao/api-neon/limite-corpo-http.test.mjs homologacao/api-neon/interface-v2.test.mjs homologacao/api-neon/operacoes-neon-seguranca.test.mjs homologacao/api-neon/fluxo-recuperacao-http.test.mjs homologacao/api-neon/autenticacao-admin-seguranca.test.mjs homologacao/api-neon/bloqueios-implantacao.test.mjs homologacao/api-neon/migracao-legado-v2.test.mjs homologacao/api-neon/cliente-v2-seguranca.test.mjs homologacao/api-neon/acompanhar-legado-seguranca.test.mjs homologacao/api-neon/acompanhar-v2-seguranca.test.mjs homologacao/api-neon/isolamento-protocolo-consulta.test.mjs homologacao/api-neon/recuperacao-neutralidade-http.test.mjs homologacao/api-neon/contrato-tres-telas-seguranca.test.mjs homologacao/api-neon/prontidao-migracao.test.mjs homologacao/api-neon/chaves-legadas-homologacao.test.mjs homologacao/api-neon/emissao-legada-interna.test.mjs homologacao/api-neon/repositorio-chaves-legadas.test.mjs homologacao/api-neon/transacao-postgres.test.mjs homologacao/api-neon/fluxo-legado-http.test.mjs homologacao/api-neon/emissor-legado-postgres.test.mjs homologacao/api-neon/rpc-emissao-restrita.test.mjs homologacao/api-neon/verificar-vinculo-legado.test.mjs homologacao/api-neon/integracao-verificador-emissor.test.mjs homologacao/api-neon/repositorio-chaves-legadas-seguranca.test.mjs homologacao/api-neon/rollback-emissao-legada.test.mjs homologacao/api-neon/verificador-emissao-assistida.test.mjs homologacao/api-neon/emissor-assistido-postgres.test.mjs homologacao/api-neon/buscar-vinculo-supabase.test.mjs homologacao/api-neon/emissor-com-vinculo-legado.test.mjs homologacao/api-neon/auditar-politica-emissao.test.mjs homologacao/api-neon/comprovante-assinado.test.mjs homologacao/api-neon/emissor-com-comprovante-assinado.test.mjs homologacao/api-neon/diagnosticar-emissao-legada.test.mjs homologacao/api-neon/persistencia-rpc-ficticia.test.mjs homologacao/api-neon/emissor-rpc-ficticio.test.mjs homologacao/api-neon/conferencia-privada-assinada.test.mjs homologacao/api-neon/fluxo-privado-emissao-rpc.test.mjs homologacao/api-neon/consulta-privada-supabase-rest.test.mjs homologacao/api-neon/fluxo-privado-com-supabase.test.mjs homologacao/api-neon/autorizar-operador-supabase.test.mjs homologacao/api-neon/fluxo-operador-autenticado.test.mjs homologacao/api-neon/conferidor-manual-auditado.test.mjs homologacao/api-neon/fluxo-com-decisao-manual.test.mjs homologacao/api-neon/fonte-decisao-neon.test.mjs homologacao/api-neon/autorizar-operador-vinculado.test.mjs homologacao/api-neon/registrar-decisao-privada.test.mjs homologacao/api-neon/gravador-decisao-rpc.test.mjs homologacao/api-neon/fonte-evidencia-assinada.test.mjs homologacao/api-neon/registro-com-conferente-independente.test.mjs homologacao/api-neon/registro-decisao-antirreplay.test.mjs homologacao/api-neon/gravador-sintetico-900007.test.mjs homologacao/api-neon/registro-sintetico-assinado-900007.test.mjs homologacao/api-neon/rota-decisao-sintetica.test.mjs homologacao/api-neon/auditar-politica-emissao-negativos.test.mjs homologacao/api-neon/iniciar-homologacao.test.mjs homologacao/api-neon/rota-sintetica-http-integrada.test.mjs homologacao/api-neon/migracao-conferente-independente-900007.test.mjs
      - name: Executar testes adicionais antes omitidos do CI
        run: node --test homologacao/api-neon/autenticacao-negativa.test.mjs homologacao/api-neon/carga.test.mjs homologacao/api-neon/cors.test.mjs homologacao/api-neon/desafio-recuperacao.test.mjs homologacao/api-neon/executores-postgres.test.mjs homologacao/api-neon/executores-seguranca.test.mjs homologacao/api-neon/fluxo-recuperacao-automatico.test.mjs homologacao/api-neon/http-fronteira-regressao.test.mjs homologacao/api-neon/identidade-isolada.test.mjs homologacao/api-neon/identidade-servidor.test.mjs homologacao/api-neon/integracao.test.mjs homologacao/api-neon/isolamento-http.test.mjs homologacao/api-neon/limitador-http.test.mjs homologacao/api-neon/limitador.test.mjs homologacao/api-neon/operacoes-neon-contrato.test.mjs homologacao/api-neon/operacoes-neon.test.mjs homologacao/api-neon/recuperacao-dupla-seguranca.test.mjs homologacao/api-neon/regressao-autorizacao-http.test.mjs homologacao/api-neon/regressao-http-seguranca.test.mjs homologacao/api-neon/rotas-cidadao.test.mjs homologacao/api-neon/seguranca-cors-auth-regressao.test.mjs homologacao/api-neon/seguranca-limites-adicionais.test.mjs homologacao/api-neon/seguranca-negativa.test.mjs homologacao/api-neon/server.test.mjs homologacao/api-neon/verificar-admin-supabase.test.mjs
      - name: Validar recuperação manual no Render e prova Neon isolada
        run: node homologacao/api-neon/smoke-manual-render.mjs
