name: Testes HTTP locais sem segredos
on:
  push:
    branches: [feature/recuperacao-whatsapp-manual]
    paths:
      - 'homologacao/api-neon/**'
      - 'v2/**'
      - 'painel/**'
      - '.github/workflows/testes-http-locais-seguros.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências fixadas
        working-directory: homologacao/api-neon
        run: npm ci --ignore-scripts
      - name: Suite completa isolada
        working-directory: homologacao/api-neon
        run: npm test && npm run test:hml
      - name: Regressão das telas originais V2 e Painel
        run: node --test v2/seguranca/*.test.mjs painel/tests/*.test.cjs
