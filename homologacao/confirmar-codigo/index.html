<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar código — Mandato em Ação</title><style>body{font:16px system-ui,sans-serif;max-width:440px;margin:3rem auto;padding:0 1rem;color:#162b46}label{display:block;margin:1rem 0 .4rem}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:.8rem;border:1px solid #8995a6;border-radius:8px}button{background:#174c91;color:white;margin-top:1.5rem;cursor:pointer}#resultado{margin-top:1.5rem;min-height:2rem}</style></head><body><main><h1>Confirmar código</h1><p>Digite o código recebido pelo WhatsApp. Ele expira em cinco minutos e só pode ser utilizado uma vez.</p><form id="form"><label for="pedido">Número da solicitação</label><input id="pedido" inputmode="numeric" pattern="[1-9][0-9]{0,15}" required><label for="desafio">Identificador da confirmação</label><input id="desafio" pattern="[a-f0-9]{32}" maxlength="32" required><label for="acao">Operação</label><select id="acao"><option value="emitir">Criar chave</option><option value="revogar">Revogar chave</option></select><label for="codigo">Código de seis dígitos</label><input id="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button type="submit">Confirmar código</button></form><p id="resultado" role="status" aria-live="polite"></p><p><small>Esta etapa confirma o código, não substitui a conferência de identidade do titular.</small></p></main><script>const API='https://mandato-neon-homologacao.onrender.com';const f=document.getElementById('form'),status=document.getElementById('resultado');const q=new URLSearchParams(location.search);for(const [id,key] of [['pedido','solicitacaoId'],['desafio','desafioId'],['acao','acao']]){if(q.has(key))document.getElementById(id).value=q.get(key)}f.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Verificando…';const b=f.querySelector('button');b.disabled=true;try{const r=await fetch(API+'/api/cidadao/confirmar-codigo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({solicitacaoId:document.getElementById('pedido').value,desafioId:document.getElementById('desafio').value,acao:document.getElementById('acao').value,codigo:document.getElementById('codigo').value})});const data=await r.json();status.textContent=r.ok&&data.confirmado===true?'Código confirmado. Aguarde a conferência administrativa.':'Não foi possível confirmar. Confira o código ou solicite outro.';}catch{status.textContent='Serviço indisponível. Tente novamente mais tarde.'}finally{b.disabled=false;document.getElementById('codigo').value=''}});</script></body></html>
